name: Refine status recommendation

on:
  push:
    branches:
      - agent/simple-case-statuses

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/simple-case-statuses
          fetch-depth: 0

      - name: Apply focused refinement
        run: python scripts/refine-status-recommendation.py

      - name: Commit refinement
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/inspection-app.tsx
          git commit -m "修正自動結案建議判斷"
          git push origin HEAD:agent/simple-case-statuses
