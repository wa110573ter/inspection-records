name: Apply simple case statuses

on:
  push:
    branches:
      - agent/simple-case-statuses

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/simple-case-statuses
          fetch-depth: 0

      - name: Apply focused source changes
        run: python scripts/apply-simple-statuses.py

      - name: Commit generated changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/inspection-app.tsx app/journal/journal-client.tsx
          git commit -m "簡化案件狀態並加入進度選單"
          git push origin HEAD:agent/simple-case-statuses
