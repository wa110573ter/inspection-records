name: Patch status hardening

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-status-hardening
  cancel-in-progress: false

jobs:
  patch:
    if: github.head_ref == 'agent/status-bug-hardening' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/status-bug-hardening
          fetch-depth: 0

      - name: Apply UI patches
        run: python scripts/patch-status-hardening.py

      - name: Commit patched files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/inspection-app.tsx app/journal/journal-client.tsx app/import/import-app.tsx
          git commit -m "修正狀態畫面防呆與建議邏輯"
          git push origin HEAD:agent/status-bug-hardening
