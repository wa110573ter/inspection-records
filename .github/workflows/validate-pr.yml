name: Validate inspection records

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - agent/date-timeline-dropdowns
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript strict check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Build and rendered HTML tests
        run: npm test

      - name: Validate built artifact
        run: npm run validate:artifact
