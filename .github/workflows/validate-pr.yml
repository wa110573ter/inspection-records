name: Validate inspection records

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - agent/date-timeline-dropdowns
      - agent/native-workflow-fix
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Apply native source payload
        if: (github.event_name == 'pull_request' && github.head_ref == 'agent/native-workflow-fix') || (github.event_name == 'push' && github.ref == 'refs/heads/agent/native-workflow-fix')
        shell: bash
        run: |
          python scripts/apply-native-payload.py
          if git diff --quiet -- app/inspection-app.tsx app/page.tsx; then
            echo "No source changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/inspection-app.tsx app/page.tsx
          git commit -m "將追蹤與下拉功能改為原生表單"
          git push

      - name: Remove source transport files
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/native-workflow-fix'
        shell: bash
        run: |
          python scripts/cleanup-native-payload.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "移除原生表單傳輸暫存檔"
          git push

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript strict check
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npx tsc --noEmit > typecheck.log 2>&1
          code=$?
          cat typecheck.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: ESLint
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run lint > eslint.log 2>&1
          code=$?
          cat eslint.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Build and rendered HTML tests
        id: test
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm test > test.log 2>&1
          code=$?
          cat test.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Validate built artifact
        id: artifact
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run validate:artifact > artifact.log 2>&1
          code=$?
          cat artifact.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            typecheck.log
            eslint.log
            test.log
            artifact.log
          if-no-files-found: ignore

      - name: Upload editable source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editable-source
          path: |
            app/inspection-app.tsx
            app/page.tsx
          if-no-files-found: error

      - name: Final validation gate
        if: always()
        shell: bash
        run: |
          echo "TypeScript: ${{ steps.typecheck.outputs.exit_code }}"
          echo "ESLint: ${{ steps.lint.outputs.exit_code }}"
          echo "Tests: ${{ steps.test.outputs.exit_code }}"
          echo "Artifact: ${{ steps.artifact.outputs.exit_code }}"
          test "${{ steps.typecheck.outputs.exit_code }}" = "0"
          test "${{ steps.lint.outputs.exit_code }}" = "0"
          test "${{ steps.test.outputs.exit_code }}" = "0"
          test "${{ steps.artifact.outputs.exit_code }}" = "0"
